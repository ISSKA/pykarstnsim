[project]
name = "pykarstnsim"
version = "1.0.1"
description = "A Python interface for the KarstNSim C++ library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "ISSKA SISKA – Swiss Institute for Speleology and Karst Studies"},
]
keywords = ["karst", "simulation", "geology", "hydrogeology", "3d", "pybind11"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.0.2",
]

[project.urls]
Homepage     = "https://github.com/ISSKA/pykarstnsim"
Repository   = "https://github.com/ISSKA/pykarstnsim"
Issues       = "https://github.com/ISSKA/pykarstnsim/issues"
Documentation = "https://github.com/ISSKA/KarstNSim_Public/blob/main/config_reference.md"

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11", "pybind11-stubgen"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
build.targets = ["pykarstnsim_core"]
wheel.packages = ["src/pykarstnsim"]
cmake.build-type = "Release"

[tool.cibuildwheel]
build-frontend = "build[uv]"

build = "cp3{9,10,11,12,13,14}-*"

test-command = "python -c \"import pykarstnsim; print('pykarstnsim OK')\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image  = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.uv.sources]
pykarstnsim = { workspace = true }

[dependency-groups]
dev = [
  "pykarstnsim",
  "pybind11-stubgen>=2.5.5",
]